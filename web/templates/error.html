{% extends "base.html" %}
{% block title %}Lỗi {{ code }}{% endblock %}
{% block content %}
<div class="qc-auth-wrap">
  <div class="qc-card p-5 text-center" style="max-width:480px">
    <div class="display-1 fw-bold" style="background:var(--qc-grad);-webkit-background-clip:text;background-clip:text;color:transparent">{{ code }}</div>
    <p class="lead text-secondary">{{ message }}</p>
    <a href="{{ url_for('index') }}" class="btn btn-primary"><i class="bi bi-house"></i> Về trang chủ</a>
  </div>
</div>
{% endblock %}
