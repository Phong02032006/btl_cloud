{% extends "base.html" %}
{% block title %}Tạo bài thi{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <a href="{{ url_for('teacher_dashboard') }}" class="qc-breadcrumb"><i class="bi bi-arrow-left"></i> Bảng điều khiển</a>
    <h2 class="mt-1 mb-4">Tạo bài thi mới</h2>
    <div class="qc-card p-4 p-md-5">
      <form method="post">
        <input type="hidden" name="csrf" value="{{ csrf_token() }}">
        <div class="mb-3"><label class="form-label">Tên bài thi</label><input name="title" class="form-control form-control-lg" placeholder="VD: Kiểm tra giữa kỳ - Điện toán đám mây" required></div>
        <div class="mb-3"><label class="form-label">Mô tả</label><textarea name="description" class="form-control" rows="3" placeholder="Nội dung, phạm vi kiến thức..."></textarea></div>
        <div class="row g-3 mb-4">
          <div class="col-sm-6"><label class="form-label"><i class="bi bi-clock"></i> Thời gian làm bài (phút)</label><input name="duration_minutes" type="number" min="1" value="15" class="form-control"></div>
          <div class="col-sm-6"><label class="form-label"><i class="bi bi-trophy"></i> Ngưỡng đạt (%)</label><input name="pass_percent" type="number" min="0" max="100" value="50" class="form-control"></div>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-primary"><i class="bi bi-check2"></i> Tạo và thêm câu hỏi</button>
          <a href="{{ url_for('teacher_dashboard') }}" class="btn btn-ghost">Huỷ</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
